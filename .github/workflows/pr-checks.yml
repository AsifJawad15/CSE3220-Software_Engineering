# ═══════════════════════════════════════════════════════════════════════════════
# PULL REQUEST CHECKS - Validates PRs Before Merging
# ═══════════════════════════════════════════════════════════════════════════════
#
# PURPOSE:
# - This workflow runs ONLY on Pull Requests
# - It validates that all tests pass BEFORE you can merge
# - Combined with Branch Protection Rules, it prevents broken code from merging
#
# WHEN DOES THIS RUN?
# - opened: When a new PR is created
# - synchronize: When new commits are pushed to a PR
# - reopened: When a closed PR is reopened
#
# ═══════════════════════════════════════════════════════════════════════════════

name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # VALIDATE PULL REQUEST
  # ═══════════════════════════════════════════════════════════════════════════
  validate:
    name: Validate PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          java-version: '22'
          distribution: 'temurin'
          cache: maven

      # Compile the code first
      - name: Compile code
        run: mvn compile -B

      # Run all tests
      - name: Run all tests
        run: mvn test -Dspring.profiles.active=test -B

      # Show error message if tests fail
      - name: Check for test failures
        if: failure()
        run: |
          echo "❌ Tests failed! Please fix before merging."
          exit 1

      # Show success message if all tests pass
      - name: Success message
        if: success()
        run: echo "✅ All tests passed! Ready for review."
