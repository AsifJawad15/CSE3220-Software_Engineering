# ???????????????????????????????????????????????????????????????????????????????
# TEST CONFIGURATION - application-test.properties
# ???????????????????????????????????????????????????????????????????????????????
#
# WHAT IS H2 DATABASE?
# H2 is an in-memory database that:
# - Runs entirely in RAM (no installation needed)
# - Creates fresh database for each test run
# - Is destroyed when tests finish (no cleanup needed)
# - Perfect for CI/CD pipelines (no Docker required)
#
# WHY USE H2 FOR TESTING?
# - Your production uses PostgreSQL (heavy, needs Docker)
# - Tests should be FAST and ISOLATED
# - H2 simulates a real database but runs in memory
# - GitHub Actions can run tests without setting up PostgreSQL
# ???????????????????????????????????????????????????????????????????????????????

# H2 In-Memory Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Docker Compose for tests (we use H2, not PostgreSQL)
spring.docker.compose.enabled=false

# Reduce logging noise during tests
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
