<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
    STUDENT COURSES PAGE (READ ONLY)

    Shows courses the student is enrolled in.
    Students can only VIEW - they cannot enroll/unenroll themselves.

    Thymeleaf Loop:
    - th:each="course : ${courses}" → Loops through each course in the list
    - Inside the loop, 'course' variable holds current item
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses - Student</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container">
        <h1>📚 My Enrolled Courses</h1>

        <!-- Navigation -->
        <div class="nav-links">
            <a th:href="@{/dashboard}">🏠 Dashboard</a>
            <a th:href="@{/student/profile}">👤 My Profile</a>
        </div>

        <!-- Courses Table -->
        <table>
            <thead>
                <tr>
                    <th>Code</th>
                    <th>Course Name</th>
                    <th>Description</th>
                    <th>Credits</th>
                    <th>Instructor</th>
                </tr>
            </thead>
            <tbody>
                <!-- Loop through courses -->
                <tr th:each="course : ${courses}">
                    <td th:text="${course.code}">CSE301</td>
                    <td th:text="${course.name}">Database Systems</td>
                    <td th:text="${course.description} ?: 'No description'">Course description</td>
                    <td th:text="${course.credits}">3</td>
                    <td th:text="${course.teacher != null} ? ${course.teacher.firstName + ' ' + course.teacher.lastName} : 'TBA'">
                        John Doe
                    </td>
                </tr>

                <!-- Empty State - Shows when no courses enrolled -->
                <tr th:if="${#lists.isEmpty(courses)}">
                    <td colspan="5" class="empty-state">
                        You are not enrolled in any courses yet.<br>
                        Please contact your teacher for course enrollment.
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Back Button -->
        <div class="button-group">
            <a th:href="@{/dashboard}" class="btn btn-secondary">← Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
