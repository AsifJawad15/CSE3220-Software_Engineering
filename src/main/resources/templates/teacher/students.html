<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
    STUDENTS LIST PAGE (READ + DELETE links)

    Shows all students with options to:
    - Add new student (CREATE)
    - Edit student (UPDATE)
    - Delete student (DELETE)
    - Manage enrollments
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Students - Teacher</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container">
        <h1>🎓 Manage Students</h1>

        <!-- Navigation -->
        <div class="nav-links">
            <a th:href="@{/dashboard}">🏠 Dashboard</a>
            <a th:href="@{/teacher/departments}">🏛️ Departments</a>
            <a th:href="@{/teacher/courses}">📖 Courses</a>
        </div>

        <!-- Add New Button -->
        <div class="text-center mb-20">
            <a th:href="@{/teacher/students/new}" class="btn btn-success">➕ Add New Student</a>
        </div>

        <!-- Students Table -->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Student ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Department</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="student : ${students}">
                    <td th:text="${student.id}">1</td>
                    <td th:text="${student.username}">user</td>
                    <td th:text="${student.studentId}">STU001</td>
                    <td th:text="${student.firstName + ' ' + student.lastName}">John Doe</td>
                    <td th:text="${student.email} ?: 'N/A'">email@example.com</td>
                    <td th:text="${student.department != null} ? ${student.department.name} : 'N/A'">CSE</td>
                    <td class="table-actions">
                        <!-- Edit Link -->
                        <a th:href="@{/teacher/students/edit/{id}(id=${student.id})}">✏️ Edit</a>
                        <!-- Enrollments Link -->
                        <a th:href="@{/teacher/students/{id}/enrollments(id=${student.id})}">📚 Courses</a>
                        <!-- Delete Link with confirmation -->
                        <a th:href="@{/teacher/students/delete/{id}(id=${student.id})}"
                           class="btn-danger"
                           onclick="return confirm('Are you sure you want to delete this student?')">
                            🗑️ Delete
                        </a>
                    </td>
                </tr>

                <!-- Empty State -->
                <tr th:if="${#lists.isEmpty(students)}">
                    <td colspan="7" class="empty-state">
                        No students found. Click "Add New Student" to create one!
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Back Button -->
        <div class="button-group">
            <a th:href="@{/dashboard}" class="btn btn-secondary">← Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
