<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
    TEACHER PROFILE FORM (UPDATE)

    Teachers CAN edit their own profile.

    Form Binding:
    - th:object="${teacher}" → Binds form to teacher object
    - th:field="*{firstName}" → Binds input to teacher.firstName
    - The * syntax is shorthand when th:object is defined
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - Teacher</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container container-medium">
        <h1>👤 Edit My Profile</h1>

        <!-- Navigation -->
        <div class="nav-links">
            <a th:href="@{/dashboard}">🏠 Dashboard</a>
            <a th:href="@{/teacher/students}">🎓 Students</a>
            <a th:href="@{/teacher/courses}">📖 Courses</a>
        </div>

        <!-- Profile Edit Form -->
        <form th:action="@{/teacher/profile}" th:object="${teacher}" method="post">
            <!-- Hidden ID field - needed for UPDATE -->
            <input type="hidden" th:field="*{id}"/>
            <input type="hidden" th:field="*{username}"/>
            <input type="hidden" th:field="*{role}"/>

            <div class="form-group">
                <label for="firstName">First Name</label>
                <input type="text" id="firstName" th:field="*{firstName}" required/>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name</label>
                <input type="text" id="lastName" th:field="*{lastName}" required/>
            </div>

            <div class="form-group">
                <label for="designation">Designation</label>
                <input type="text" id="designation" th:field="*{designation}"
                       placeholder="e.g., Professor, Lecturer"/>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}"/>
            </div>

            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input type="text" id="phoneNumber" th:field="*{phoneNumber}"/>
            </div>

            <div class="form-group">
                <label for="departmentId">Department</label>
                <select id="departmentId" name="departmentId">
                    <option value="">-- Select Department --</option>
                    <option th:each="dept : ${departments}"
                            th:value="${dept.id}"
                            th:text="${dept.name}"
                            th:selected="${teacher.department != null and teacher.department.id == dept.id}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="password">New Password (leave blank to keep current)</label>
                <input type="password" id="password" name="password"
                       placeholder="Enter new password or leave empty"/>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-primary">💾 Save Changes</button>
                <a th:href="@{/dashboard}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
