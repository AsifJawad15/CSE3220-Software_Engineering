<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
    STUDENT ENROLLMENTS PAGE

    Allows teachers to:
    - See which courses a student is enrolled in
    - Enroll student in new courses
    - Unenroll student from courses
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Enrollments</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container">
        <h1>📚 Course Enrollments</h1>
        <h2 class="text-center" style="border: none; color: #546E7A;">
            Student: <span th:text="${student.firstName + ' ' + student.lastName}">John Doe</span>
            (<span th:text="${student.studentId}">STU001</span>)
        </h2>

        <!-- Navigation -->
        <div class="nav-links">
            <a th:href="@{/dashboard}">🏠 Dashboard</a>
            <a th:href="@{/teacher/students}">🎓 Students</a>
            <a th:href="@{/teacher/courses}">📖 Courses</a>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">

            <!-- Currently Enrolled Courses -->
            <div class="card">
                <h2 class="card-title">✅ Enrolled Courses</h2>

                <table th:if="${not #lists.isEmpty(enrolledCourses)}">
                    <thead>
                        <tr>
                            <th>Course</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="course : ${enrolledCourses}">
                            <td>
                                <strong th:text="${course.code}">CSE301</strong> -
                                <span th:text="${course.name}">Database</span>
                            </td>
                            <td>
                                <form th:action="@{/teacher/students/{sId}/unenroll/{cId}(sId=${student.id}, cId=${course.id})}"
                                      method="post" style="display: inline;">
                                    <button type="submit" class="btn-danger" style="padding: 5px 10px; font-size: 12px;"
                                            onclick="return confirm('Remove this course?')">
                                        ❌ Remove
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <p th:if="${#lists.isEmpty(enrolledCourses)}" class="text-center" style="color: #78909C; padding: 20px;">
                    Not enrolled in any courses yet.
                </p>
            </div>

            <!-- Available Courses to Enroll -->
            <div class="card">
                <h2 class="card-title">📋 Available Courses</h2>

                <table th:if="${not #lists.isEmpty(availableCourses)}">
                    <thead>
                        <tr>
                            <th>Course</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="course : ${availableCourses}">
                            <td>
                                <strong th:text="${course.code}">CSE302</strong> -
                                <span th:text="${course.name}">Web Dev</span>
                            </td>
                            <td>
                                <form th:action="@{/teacher/students/{sId}/enroll/{cId}(sId=${student.id}, cId=${course.id})}"
                                      method="post" style="display: inline;">
                                    <button type="submit" class="btn-success" style="padding: 5px 10px; font-size: 12px;">
                                        ✅ Enroll
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <p th:if="${#lists.isEmpty(availableCourses)}" class="text-center" style="color: #78909C; padding: 20px;">
                    All courses are already enrolled or no courses exist.
                </p>
            </div>
        </div>

        <!-- Back Button -->
        <div class="button-group mt-20">
            <a th:href="@{/teacher/students}" class="btn btn-secondary">← Back to Students</a>
        </div>
    </div>
</body>
</html>
