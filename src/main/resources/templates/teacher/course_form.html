<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
    COURSE FORM (CREATE / UPDATE)
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${course.id == null} ? 'Add Course' : 'Edit Course'">Course Form</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container container-medium">
        <h1 th:text="${course.id == null} ? '➕ Add New Course' : '✏️ Edit Course'">
            Course Form
        </h1>

        <!-- Navigation -->
        <div class="nav-links">
            <a th:href="@{/dashboard}">🏠 Dashboard</a>
            <a th:href="@{/teacher/courses}">📖 Courses</a>
        </div>

        <!-- Course Form -->
        <form th:action="@{/teacher/courses}" th:object="${course}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label for="code">Course Code *</label>
                <input type="text" id="code" th:field="*{code}" required
                       placeholder="e.g., CSE301, EEE201"/>
            </div>

            <div class="form-group">
                <label for="name">Course Name *</label>
                <input type="text" id="name" th:field="*{name}" required
                       placeholder="e.g., Database Management Systems"/>
            </div>

            <div class="form-group">
                <label for="credits">Credits *</label>
                <input type="number" id="credits" th:field="*{credits}" required min="1" max="6"
                       placeholder="e.g., 3"/>
            </div>

            <div class="form-group">
                <label for="teacherId">Instructor</label>
                <select id="teacherId" name="teacherId">
                    <option value="">-- Select Instructor --</option>
                    <option th:each="teacher : ${teachers}"
                            th:value="${teacher.id}"
                            th:text="${teacher.firstName + ' ' + teacher.lastName + ' (' + teacher.designation + ')'}"
                            th:selected="${course.teacher != null and course.teacher.id == teacher.id}">
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}"
                          placeholder="Course description and objectives"></textarea>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-primary">
                    💾 <span th:text="${course.id == null} ? 'Create Course' : 'Save Changes'">Save</span>
                </button>
                <a th:href="@{/teacher/courses}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
