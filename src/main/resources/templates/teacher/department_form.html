<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
    DEPARTMENT FORM (CREATE / UPDATE)
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${department.id == null} ? 'Add Department' : 'Edit Department'">Department Form</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container container-medium">
        <h1 th:text="${department.id == null} ? '➕ Add New Department' : '✏️ Edit Department'">
            Department Form
        </h1>

        <!-- Navigation -->
        <div class="nav-links">
            <a th:href="@{/dashboard}">🏠 Dashboard</a>
            <a th:href="@{/teacher/departments}">🏛️ Departments</a>
        </div>

        <!-- Department Form -->
        <form th:action="@{/teacher/departments}" th:object="${department}" method="post">
            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label for="code">Department Code *</label>
                <input type="text" id="code" th:field="*{code}" required
                       placeholder="e.g., CSE, EEE, ME"/>
            </div>

            <div class="form-group">
                <label for="name">Department Name *</label>
                <input type="text" id="name" th:field="*{name}" required
                       placeholder="e.g., Computer Science and Engineering"/>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}"
                          placeholder="Brief description of the department"></textarea>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-primary">
                    💾 <span th:text="${department.id == null} ? 'Create Department' : 'Save Changes'">Save</span>
                </button>
                <a th:href="@{/teacher/departments}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
