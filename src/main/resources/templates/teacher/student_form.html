<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
    STUDENT FORM (CREATE / UPDATE)

    This form is used for BOTH creating new students AND editing existing ones.
    - If student.id is null → CREATE mode
    - If student.id exists → UPDATE mode

    The controller checks this in saveStudent() method.
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${student.id == null} ? 'Add Student' : 'Edit Student'">Student Form</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container container-medium">
        <!-- Dynamic Title based on mode -->
        <h1 th:text="${student.id == null} ? '➕ Add New Student' : '✏️ Edit Student'">
            Student Form
        </h1>

        <!-- Navigation -->
        <div class="nav-links">
            <a th:href="@{/dashboard}">🏠 Dashboard</a>
            <a th:href="@{/teacher/students}">🎓 Students</a>
        </div>

        <!-- Student Form -->
        <form th:action="@{/teacher/students}" th:object="${student}" method="post">
            <!-- Hidden ID for UPDATE mode -->
            <input type="hidden" th:field="*{id}"/>

            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" id="username" th:field="*{username}" required
                       th:readonly="${student.id != null}"
                       placeholder="Login username (cannot be changed later)"/>
            </div>

            <div class="form-group">
                <label for="password" th:text="${student.id == null} ? 'Password *' : 'Password (leave blank to keep current)'">
                    Password
                </label>
                <input type="password" id="password" name="password"
                       th:required="${student.id == null}"
                       placeholder="Enter password"/>
            </div>

            <div class="form-group">
                <label for="studentId">Student ID *</label>
                <input type="text" id="studentId" th:field="*{studentId}" required
                       placeholder="e.g., STU001"/>
            </div>

            <div class="form-group">
                <label for="firstName">First Name *</label>
                <input type="text" id="firstName" th:field="*{firstName}" required/>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name *</label>
                <input type="text" id="lastName" th:field="*{lastName}" required/>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}"
                       placeholder="student@example.com"/>
            </div>

            <div class="form-group">
                <label for="phoneNumber">Phone Number</label>
                <input type="text" id="phoneNumber" th:field="*{phoneNumber}"
                       placeholder="123-456-7890"/>
            </div>

            <div class="form-group">
                <label for="departmentId">Department</label>
                <select id="departmentId" name="departmentId">
                    <option value="">-- Select Department --</option>
                    <option th:each="dept : ${departments}"
                            th:value="${dept.id}"
                            th:text="${dept.name}"
                            th:selected="${student.department != null and student.department.id == dept.id}">
                    </option>
                </select>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-primary">
                    💾 <span th:text="${student.id == null} ? 'Create Student' : 'Save Changes'">Save</span>
                </button>
                <a th:href="@{/teacher/students}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
