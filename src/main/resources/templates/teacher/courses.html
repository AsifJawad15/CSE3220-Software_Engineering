<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
    COURSES LIST PAGE
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Courses - Teacher</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container">
        <h1>📖 Manage Courses</h1>

        <!-- Navigation -->
        <div class="nav-links">
            <a th:href="@{/dashboard}">🏠 Dashboard</a>
            <a th:href="@{/teacher/students}">🎓 Students</a>
            <a th:href="@{/teacher/departments}">🏛️ Departments</a>
        </div>

        <!-- Add New Button -->
        <div class="text-center mb-20">
            <a th:href="@{/teacher/courses/new}" class="btn btn-success">➕ Add New Course</a>
        </div>

        <!-- Courses Table -->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Code</th>
                    <th>Name</th>
                    <th>Credits</th>
                    <th>Instructor</th>
                    <th>Enrolled</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="course : ${courses}">
                    <td th:text="${course.id}">1</td>
                    <td th:text="${course.code}">CSE301</td>
                    <td th:text="${course.name}">Database Systems</td>
                    <td th:text="${course.credits}">3</td>
                    <td th:text="${course.teacher != null} ? ${course.teacher.firstName + ' ' + course.teacher.lastName} : 'TBA'">
                        John Doe
                    </td>
                    <td th:text="${course.enrolledStudents.size()}">0</td>
                    <td class="table-actions">
                        <a th:href="@{/teacher/courses/edit/{id}(id=${course.id})}">✏️ Edit</a>
                        <a th:href="@{/teacher/courses/delete/{id}(id=${course.id})}"
                           class="btn-danger"
                           onclick="return confirm('Are you sure? This will also remove all student enrollments.')">
                            🗑️ Delete
                        </a>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(courses)}">
                    <td colspan="7" class="empty-state">
                        No courses found. Click "Add New Course" to create one!
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Back Button -->
        <div class="button-group">
            <a th:href="@{/dashboard}" class="btn btn-secondary">← Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
