<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--
    LOGIN PAGE

    Thymeleaf Attributes Explained:
    - th:href="@{/css/styles.css}" → Generates correct URL for CSS file
    - th:if="${param.error}" → Shows div only if URL has ?error parameter
    - th:if="${param.logout}" → Shows div only if URL has ?logout parameter
    - th:action="@{/login}" → Form submits to /login URL

    Spring Security automatically:
    - Handles POST /login
    - Validates username/password
    - Redirects to /dashboard on success
    - Adds ?error to URL on failure
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Student Management System</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
    <div class="container container-small" style="margin-top: 50px;">
        <!-- App Title -->
        <h1>🎓 Student Portal</h1>
        <h2 class="text-center" style="border: none; color: #546E7A;">Sign In to Continue</h2>

        <!-- Error Message - Shows when login fails -->
        <div th:if="${param.error}" class="message message-error">
            ⚠️ Invalid username or password. Please try again.
        </div>

        <!-- Success Message - Shows after logout -->
        <div th:if="${param.logout}" class="message message-success">
            ✅ You have been logged out successfully.
        </div>

        <!-- Login Form -->
        <form th:action="@{/login}" method="post" class="mt-20">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       placeholder="Enter your username" required autofocus/>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Enter your password" required/>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-primary">🔐 Sign In</button>
            </div>
        </form>


        </div>
    </div>
</body>
</html>
