<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Marketplace - Cart & Checkout</title>
    <link rel="stylesheet" href="/css/site.css">
</head>
<body>
<header class="topbar">
    <div class="container row between center wrap gap">
        <a class="brand" href="/">Mini Marketplace</a>
        <nav class="row gap wrap">
            <a class="btn nav-btn" href="/">Catalog</a>
            <a class="btn nav-btn" href="/orders">My Orders</a>
            <a id="admin-link" class="btn nav-btn hidden" href="/admin">Admin</a>
        </nav>
        <div class="row gap center wrap">
            <span id="user-badge" class="badge">Guest</span>
            <a id="login-link" class="btn nav-btn" href="/login">Login</a>
            <a id="register-link" class="btn nav-btn" href="/register">Register</a>
            <button id="logout-btn" class="danger hidden" type="button">Logout</button>
            <a id="cart-link" class="btn primary" href="/cart">Cart (0)</a>
        </div>
    </div>
</header>

<main class="container page">
    <section id="alerts"></section>
    <h2>Cart & Checkout</h2>
    <section id="cart-items" class="stack"></section>

    <section class="card stack">
        <label>Pricing Strategy (Strategy pattern)
            <select id="pricing-strategy">
                <option value="regularPricing">Regular Pricing</option>
                <option value="percentageDiscount">10% Discount</option>
                <option value="bulkDiscount">Bulk Discount (5+ qty)</option>
            </select>
        </label>
        <p id="cart-total"></p>
        <button id="checkout-btn" class="primary" type="button">Place Order</button>
        <small>Gift wrap and express shipping per item are applied through the Decorator pattern on backend.</small>
    </section>
</main>

<script type="module" src="/js/cart.js"></script>
</body>
</html>
